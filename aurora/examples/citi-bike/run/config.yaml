objective: 'Goal: analyze a public bike-share dataset to find clear, well-supported
  patterns in how people use the system over time, and write a short report.


  Data: NYC Citi Bike monthly trip-history files, publicly available from the Citi
  Bike system data page (s3.amazonaws.com/tripdata). Use one or two recent full years
  (for example 2023 and 2024). Each row is one trip with start and stop timestamps,
  station IDs, and rider type. If the data is not available in the container, say
  so and stop rather than inventing data.


  Questions to answer:

  1. How does monthly trip volume vary across the year? Is there a clear seasonal
  peak and trough?

  2. How does usage vary by day of week and hour of day? Compare weekdays and weekends,
  and identify commute peaks if present.

  3. How do member and casual riders differ in these patterns?

  4. Optional, if time allows: is daily trip count associated with temperature or
  precipitation? Use a public weather source for the same dates only if it is easy
  to get; otherwise skip this.


  Method: clean obviously bad records (negative or extreme durations, missing timestamps)
  and report how many were removed. Use plots and simple summary statistics. Report
  uncertainty where it matters, and do not claim causation.


  Good result: a short report with 3 to 5 findings, each backed by a figure or table,
  the data source and cleaning steps stated, and limitations noted (for example, the
  dataset covers only one city and the rider-type field changed definition over time).


  Constraints: work only in the campaign container. Save code, figures and the final
  report to the output directory.'
