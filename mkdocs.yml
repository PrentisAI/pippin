site_name: AURORA
site_description: Long-horizon, open-ended research with AI agents, auditors and a human in the loop
repo_url: https://github.com/titanresearchlabs/aurora
edit_uri: edit/main/docs/
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - tables
  - toc: {permalink: true}
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first campaign: getting-started/first-campaign.md
  - Concepts:
      - How a campaign runs: concepts/pipeline.md
      - Multi-agent ideation: concepts/ideation.md
      - Auditors: concepts/auditors.md
      - Working with the human: concepts/human-in-the-loop.md
      - Skills: concepts/skills.md
  - Guides:
      - Command line: guide/cli.md
      - Web console: guide/web-console.md
      - Notifications: guide/notifications.md
      - Cluster jobs (SLURM): guide/cluster-jobs.md
      - Models and costs: guide/models-and-costs.md
      - Sandbox and security: guide/sandbox.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Configuration: reference/configuration.md
      - Campaign files: reference/workspace.md
      - Events: reference/events.md
  - Reproducing the paper: reproducing.md
  - Development: development.md
