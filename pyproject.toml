[project]
name = "aurora"
version = "0.1.0"
description = "An agent harness for long-horizon open-ended AutoResearch in computational materials science"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-generativeai>=0.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "claude-code-sdk>=0.0.25",
]

[project.scripts]
aurora = "aurora.cli:main"
aurora-lhtb = "aurora.lhtb.runner:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aurora*"]
