[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-research"
version = "0.1.0"
description = "AURORA: long-horizon, open-ended research with AI agents, auditors and a human in the loop"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "The AURORA authors" }]
keywords = ["autoresearch", "ai-scientist", "agents", "claude-code", "human-in-the-loop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "openai>=1.50",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "httpx>=0.27",          # notifications
    "cryptography>=42",     # API keys stored encrypted (accounts)
    "pypdf>=4",             # recognising uploaded papers from their PDFs
    "markdown>=3.5",        # reports shared through a read-only link
]

[project.optional-dependencies]
# direct (non-OpenRouter) providers for the ideation seats and chair
anthropic = ["anthropic>=0.40"]
gemini = ["google-generativeai>=0.8"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.urls]
Homepage = "https://github.com/prentisai/aurora"
Documentation = "https://github.com/prentisai/aurora/tree/main/docs"
Issues = "https://github.com/prentisai/aurora/issues"

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.setuptools.package-data]
aurora = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "UP007", "B904", "UP042", "UP035", "B905"]
