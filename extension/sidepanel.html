<!doctype html>
<html><head><meta charset="utf-8"><title>Pippin</title>
<style>html,body{margin:0;height:100%;background:#f6f7f9;display:flex;flex-direction:column}iframe{border:0;width:100%;flex:1}
.msg{font:13px system-ui;padding:16px;color:#444}
.pdf{font:12.5px system-ui;background:#fff8eb;border-bottom:1px solid #f3c486;padding:8px 12px;color:#5b3a06;max-height:40vh;overflow:auto}
.pdf summary{cursor:pointer;font-weight:600}.pdf .it{border-left:3px solid #f59e0b;padding:3px 8px;margin:6px 0;cursor:pointer}
.pdf .it:hover{background:#fff1d6}.pdf .sub{color:#7a5a2a;font-size:11.5px}
@media (prefers-color-scheme: dark){html,body{background:#16181d}.msg{color:#ccc}.pdf{background:#2a2215;color:#f3d9a8;border-color:#6b4d1d}.pdf .it:hover{background:#3a2e1a}.pdf .sub{color:#d6b88a}}
</style></head>
<body><details class="pdf" id="pdf" hidden><summary id="pdfhead"></summary><div id="pdflist"></div></details>
<div class="msg" id="msg">Connecting to Pippin…</div><iframe id="panel" hidden></iframe>
<script src="sidepanel.js" type="module"></script></body></html>
