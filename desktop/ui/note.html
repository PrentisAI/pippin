<!doctype html>
<html><head><meta charset="utf-8"><title>A thought</title>
<style>
html,body{margin:0;background:transparent;font:14px -apple-system,system-ui,"PingFang SC",sans-serif}
.box{margin:8px;padding:10px 12px;border-radius:14px;background:#fff;color:#1f2328;box-shadow:0 8px 28px rgba(0,0,0,.25);border:1px solid #d7dbe3}
textarea{width:100%;box-sizing:border-box;border:0;outline:0;resize:none;font:inherit;background:transparent;color:inherit}
.hint{color:#667;font-size:11.5px;display:flex;justify-content:space-between;gap:8px}
@media (prefers-color-scheme: dark){.box{background:#1e2128;color:#e6edf3;border-color:#3a4150}.hint{color:#9aa4b2}}
</style></head>
<body><div class="box">
<textarea id="t" rows="3" placeholder="A thought about what you are reading…"></textarea>
<div class="hint"><span id="about"></span><span>↵ keep · ⇧↵ new line · esc close</span></div>
</div>
<script>
const { invoke } = window.__TAURI__.core
const t = document.getElementById('t')
const win = window.__TAURI__.window.getCurrentWindow()
window.__TAURI__.event.listen('note-open', (e) => { t.value = ''; document.getElementById('about').textContent = e.payload ? `about ${e.payload}` : ''; t.focus() })
t.addEventListener('keydown', async (e) => {
  if (e.key === 'Escape') { win.hide(); return }
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    const text = t.value.trim()
    if (!text) return
    win.hide()
    try { await invoke('keep_thought', { text }) } catch (err) { invoke('peek', { head: 'Could not keep it', body: String(err).slice(0, 200) }) }
  }
})
window.addEventListener('blur', () => { if (!t.value.trim()) win.hide() })
</script>
</body></html>
