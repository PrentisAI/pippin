# The materials-science case study of the paper (Section 4): Zn segregation in
# Cu-Zn alloys under methanol-synthesis conditions.
#
# This is a long campaign: DFT (Quantum ESPRESSO) and machine-learned
# interatomic potentials run inside the container. Build the image first:
#   docker build -t aurora-materials:latest examples/cu_zn_segregation
# then:
#   aurora run examples/cu_zn_segregation/config.yaml
# On a workstation the DFT steps take days; give the container many cores.

objective: >
  Map the surface segregation of Zn in Cu1-xZnx alloys across the low-index
  facets (111), (100) and (110) and Zn concentrations x = 0.05-0.30. Quantify
  how the segregation energy depends on coverage and on adsorbed reaction
  intermediates, cross-check the DFT results with at least two machine-learned
  interatomic potentials, and assess what this means for the stability of
  Cu/ZnO methanol-synthesis catalysts under operating conditions.

inputs:
  - objective.md                # background, method notes and quality gates

ideation:
  mode: roundtable

agent:
  research_timeout_minutes: 240
  max_research_iterations: 20
  max_followup_cycles: 3

sandbox:
  image: aurora-materials:latest
  cpus: 32
  memory_mb: 131072

human:
  autonomy: supervised
  approve_termination: true     # a domain expert signs off before the campaign ends

budget:
  max_hours: 120
  max_cost_usd: 500
