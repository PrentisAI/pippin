# Simple AURORA demo — runs fully offline with mock LLM and mock tools
# Usage: python -m aurora run --config examples/simple_demo/config.yaml

campaign_id: "demo_simple_001"
objective: >
  Investigate surface segregation energetics of Zn in Cu(111) and its
  effect on CO adsorption for methanol synthesis catalyst design.
domain: "computational_materials_science"

# Offline: mock models and tools, no Claude Code, no Docker, no API key
mock_mode: true

# Use mock provider for all stages (no API keys needed)
llm_assignment:
  roundtable_seat:
    - "mock-seat-alpha"
    - "mock-seat-beta"
  roundtable_chair: "mock-chair"
  idea_screening: "mock-screener"
  researcher: "mock-researcher"
  auditor_triage: "mock-auditor-triage"
  auditor_deep: "mock-auditor-deep"
  analyzer: "mock-analyzer"
  writer: "mock-writer"

llm_providers:
  - provider: "mock"

workspace:
  workspace_root: "./workspace"
  no_delete_policy: true

resource_limits:
  max_wall_clock_hours: 1.0
  max_gpu_hours: 10.0
  monthly_token_budget: 100000
  per_cell_wall_time_minutes: 5
  max_concurrent_simulations: 2

human_checkpoints:
  require_approval_for: []  # auto-approve everything for demo
  auto_approve_timeout_seconds: 0

# Pipeline parameters
max_followup_cycles: 1
max_roundtable_rounds: 2
num_roundtable_seats: 2
max_research_iterations: 10
